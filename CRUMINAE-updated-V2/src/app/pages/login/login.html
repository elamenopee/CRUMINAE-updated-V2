
<ion-content class="login-content">
  <div class="login-container">

    <!-- Decorative background -->
    <div class="pink-blob blob-top"></div>
    <div class="pink-blob blob-bottom"></div>

    <!-- Brand -->
    <div class="brand-row">
      <img src="assets/icon/logo.png" alt="Cruminae Logo" />
      <div class="brand-copy">
        <span class="brand-name">Cruminae</span>
        <span class="brand-tagline">COOKIES THAT FEEL LIKE HOME</span>
      </div>
    </div>

    <!-- Cookie illustration -->
    <div class="cookie-decoration" aria-hidden="true">
      <span class="cookie-main">🍪</span>
      <span class="sparkle sparkle-one">✦</span>
      <span class="sparkle sparkle-two">✧</span>
      <span class="sparkle sparkle-three">✦</span>
    </div>

    <!-- Welcome -->
    <div class="login-header">
      <span class="eyebrow">A LITTLE SWEETNESS AWAITS</span>
      <h1>Welcome <span>Back!</span></h1>
      <p>Log in to your account and continue your sweet journey.</p>
    </div>

    <!-- Login form -->
    <div class="form-card">
      <form (ngSubmit)="login()">

        <div class="form-group">
          <label for="login-email">Email Address</label>
          <div class="input-wrapper">
            <ion-icon name="mail-outline"></ion-icon>
            <input
              id="login-email"
              type="email"
              name="email"
              [(ngModel)]="email"
              placeholder="Enter your email"
              autocomplete="email"
              required
            />
          </div>
        </div>

        <div class="form-group">
          <label for="login-password">Password</label>
          <div class="input-wrapper">
            <ion-icon name="lock-closed-outline"></ion-icon>
            <input
              id="login-password"
              [type]="showPassword ? 'text' : 'password'"
              name="password"
              [(ngModel)]="password"
              placeholder="Enter your password"
              autocomplete="current-password"
              required
            />

            <button
              type="button"
              class="password-toggle"
              (click)="showPassword = !showPassword"
              [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'">
              <ion-icon
                [name]="showPassword ? 'eye-off-outline' : 'eye-outline'">
              </ion-icon>
            </button>
          </div>
        </div>

        <p class="error-message" *ngIf="error" role="alert">
          {{ error }}
        </p>

        <button type="submit" class="login-button">
          Log In <span aria-hidden="true">→</span>
        </button>

      </form>

      <div class="signup-link">
        Don't have an account?
        <a routerLink="/signup">Sign Up</a>
      </div>
    </div>

    <a routerLink="/pages/dashboard" class="back-link">
      <span aria-hidden="true">←</span> Continue as Guest
    </a>

    <p class="bottom-note">Baked with love, just for you ♡</p>

  </div>
</ion-content>
